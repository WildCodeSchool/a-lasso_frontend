name: CI Pipeline for Angular

on:
  push:
    branches-ignore:
      - staging
      - production
      - development

  pull_request:
    branches:
      - development
      - staging
      - production

jobs:
  lint-test:
    name: 🧪 Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: Install dependencies
        run: npm ci

      - name: Recreate environment.secret.ts
        run: |
          echo "${{ secrets.MAP_API_KEY }}" > src/environments/environment.secret.ts

      - name: Build Angular app
        run: |
          if [ "${{ github.base_ref }}" == "production" ]; then
            npx ng build --configuration=production
          elif [ "${{ github.base_ref }}" == "staging" ]; then
            npx ng build --configuration=staging
          else
            npx ng build
          fi

  e2e-tests:
    name: 🚀 E2E Tests
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'production')
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: Install dependencies
        run: npm ci

      - name: Recreate environment.secret.ts
        run: |
          echo "${{ secrets.MAP_API_KEY }}" > src/environments/environment.secret.ts

      - name: Build Angular app for E2E
        run: |
          if [ "${{ github.base_ref }}" == "production" ]; then
            npx ng build --configuration=production
          else
            npx ng build --configuration=staging
          fi

      - name: Install Cypress dependencies
        run: npx cypress install

      - name: Run E2E tests
        run: |
          npx http-server dist/frontend/browser -p 4200 -s &
          SERVER_PID=$!

          for i in {1..30}; do
            if curl -s http://localhost:4200 > /dev/null 2>&1; then
              echo "✅ Server is ready!"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done

          if ! curl -s http://localhost:4200 > /dev/null 2>&1; then
            echo "❌ Server failed to start"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          npx cypress run --config baseUrl=http://localhost:4200
          TEST_EXIT_CODE=$?

          kill $SERVER_PID 2>/dev/null || true

          exit $TEST_EXIT_CODE

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-screenshots-${{ github.run_number }}
          path: cypress/screenshots

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: cypress-videos-${{ github.run_number }}
          path: cypress/videos
        run: npm run build
        env:
          npm_config_env: ${{ github.base_ref }}

      - name: Run E2E tests (with server)
        run: |
          if [ "${{ github.base_ref }}" == "production" ]; then
            npm_config_env=production npx start-server-and-test "npm run start-server" http://localhost:4200 "npm run e2e:ci:production"
          else
            npm_config_env=staging npx start-server-and-test "npm run start-server" http://localhost:4200 "npm run e2e:ci:staging"
          fi

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            cypress/screenshots/
            cypress/videos/
          retention-days: 7
