name: CI Pipeline for Angular

on:
  push:
    branches-ignore:
      - development
      - staging
      - production

  pull_request:
    branches:
      - development
      - staging
      - production

jobs:
  lint-test:
    name: 🧪 Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ./node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node

      - name: Install dependencies
        run: npm ci

      - name: Recreate environment.secret.ts
        run: |
          cat <<EOF > src/environments/environment.secret.ts
          export const environmentSecret = {
            apiMapKey: '${{ secrets.MAP_API_KEY }}'
          };
          EOF

      - name: Build Angular app
        run: |
          if [ "${{ github.base_ref }}" == "production" ]; then
            npx ng build --configuration=production
          elif [ "${{ github.base_ref }}" == "staging" ]; then
            npx ng build --configuration=staging
          else
            npx ng build
          fi

  e2e-tests:
    name: 🚀 E2E Tests
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'production')
    services:
      docker:
        image: docker:20.10.16
        options: --privileged
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & start Docker Compose stack
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
        run: |
          docker compose -f docker-compose.staging.yml up --build -d

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
                if curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
                  echo "✅ Backend is ready!"
                  break
                fi
                echo "Waiting for backend..."
                sleep 2
              done  

      - name: Run Cypress E2E tests
        run: |
          npx cypress install
          npx cypress run --config baseUrl=http://localhost:4200

      - name: Tear down Docker Compose
        run: docker compose -f docker-compose.staging.yml down -v

