<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-benevole">
  @for (field of fields; track $index) {
    @if (field.type === 'group' && field.children?.length) {
      <div class="coordinates-fields">
        @for (subField of field.children; track $index) {
          <div class="form-field">
            <app-input-field [label]="subField.label" [type]="subField.type" [formControlName]="subField.name" />
            <app-input-field-error [control]="form.get(subField.name)" [fieldName]="subField.name" />
          </div>
        }
      </div>
    } @else {
      <div class="form-field">
        <app-input-field
          [label]="field.label"
          [type]="field.type"
          [formControlName]="field.name"
          [showPasswordRules]="field.showPasswordRules || false" />

        <app-input-field-error
          [control]="form.get(field.name)"
          [fieldName]="field.name"
          [showPasswordMismatchError]="
            field.name === 'confirmationMotDePasse' && form.errors?.['passwordsMismatch'] && form.get('confirmationMotDePasse')?.touched
          " />
      </div>
    }
  }

  <div class="submit-button">
    <button pButton type="submit" class="register-btn" [disabled]="form.invalid">S'enregistrer</button>
  </div>
</form>
