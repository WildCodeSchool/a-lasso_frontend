<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closeOnEscape]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  (onHide)="hideModal()"
  [header]="'SE CONNECTER'"
  styleClass="login-modal">
  <div class="form-container">
    <form [formGroup]="loginForm" class="form">
      @for (field of loginFields; track $index) {
        <ng-container>
          <div class="form-field">
            <app-input-field
              [label]="field.label"
              [type]="field.type"
              [showPasswordRules]="field.showPasswordRules || false"
              [formControlName]="field.name">
            </app-input-field>
          </div>
        </ng-container>
      }

      <div class="submit-button">
        <button pButton type="submit" (click)="onSubmit()" class="register-btn">Se connecter</button>
      </div>
    </form>
  </div>
</p-dialog>
