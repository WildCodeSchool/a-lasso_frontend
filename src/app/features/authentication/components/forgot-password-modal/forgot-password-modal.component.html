<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [header]="'Mot de passe oublié'"
  [closeOnEscape]="true"
  [dismissableMask]="true"
  (onHide)="onDialogHide()"
  styleClass="forgot-password-modal">
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <app-input-field [fieldConfig]="emailField" [formGroup]="forgotPasswordForm"></app-input-field>
    <button type="submit" [disabled]="forgotPasswordForm.invalid">Envoyer</button>
  </form>
</p-dialog>
