<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [header]="'Mot de passe oublié'"
  [closeOnEscape]="true"
  [dismissableMask]="true"
  (onHide)="onDialogHide()"
  styleClass="forgot-password-modal">
  <p>Demande de réinitialisation de mot de passe</p>
  <p>Un e-mail va vous être renvoyer avec un lien de réinitialisation.</p>
  <p>Pensez à vérifier vos spams.</p>
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <app-input-field [fieldConfig]="emailField" [formGroup]="forgotPasswordForm"></app-input-field>
    <div class="submit-button">
      <button type="submit" class="register-btn" [disabled]="forgotPasswordForm.invalid">Envoyer</button>
    </div>
  </form>
</p-dialog>
