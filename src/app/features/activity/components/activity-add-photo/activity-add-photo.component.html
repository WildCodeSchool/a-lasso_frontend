<div class="add-photo-container">
  @for (photo of photos; track $index) {
    <button type="button" class="photo-box" (click)="triggerFileInput($index)">
      <i class="fa-solid fa-plus"></i>
      <i class="fa-solid fa-camera"></i>
      <h3>Ajouter une photo</h3>
    </button>
    <input type="file" accept="image/*" [id]="'fileInput' + $index" class="input-import-image" (change)="handleFileInput($event, photo.id)" />
  }
</div>
