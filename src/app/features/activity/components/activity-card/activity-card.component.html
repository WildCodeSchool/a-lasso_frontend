<div class="card-wrapper">
  <p-card class="card p-slideinup" [routerLink]="['/activity', activity.id]">
    @if (showDeleteButton) {
      <button
        class="delete-btn"
        type="button"
        (click)="onDeleteClick($event)"
        pButton
        [class.p-button-danger]="true"
        aria-label="Supprimer l'activité">
        <i class="pi pi-trash"></i>
      </button>
    }
    @if (showEditButton) {
      <button class="edit-btn" type="button" (click)="onEditClick($event)" aria-label="Modifier l'activité">
        <i class="pi pi-pencil"></i>
      </button>
    }
    <ng-template #header>
      <img class="w-full activity-image" [src]="activity.images[0].image" [alt]="activity.title" />
    </ng-template>
    <ng-template #title>
      <div class="header-description">
        <h3>
          {{ activity.title }}
        </h3>
        @if (activity) {
          <app-inscription-badge [participants]="voluntariesRegistered$ | async"></app-inscription-badge>
        }
      </div>
    </ng-template>
    <div class="description-card">
      <p class="description">
        {{ activity.description | truncate: 100 }}
      </p>
      <div class="info-asso">
        <img [src]="apiUrl + activity.association.logo" [alt]="activity.association.name" />
        <p>{{ activity.association.name }}</p>
      </div>
    </div>
    <ng-template #footer>
      <div class="footer-description">
        <div class="footer-details">
          <div class="location">
            <i class="fa-solid fa-location-dot"></i>
            <p class="mini-p">{{ activity.address.city }}</p>
          </div>
          <div class="date">
            <i class="fa-solid fa-calendar-days"></i>
            <p class="mini-p">{{ activity.date | date: 'dd/MM/yyyy' }}</p>
          </div>
        </div>

        @if (isVoluntary$ | async) {
          <app-favorite-heart [activityId]="activity.id" [isSaved]="isSavedActivity$ | async"></app-favorite-heart>
        }
      </div>
    </ng-template>
  </p-card>
</div>
