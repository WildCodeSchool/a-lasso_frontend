@if (activity$ | async; as activity) {
  <section class="activity-description-section">
    <div class="header">
      <div class="title">
        <h1>{{ activity.title }}</h1>
        <app-inscription-badge [participants]="activity.participants"></app-inscription-badge>
      </div>

      <app-favorite-heart [activityId]="activity.id" [isFavorite]="activity.isFavorite"></app-favorite-heart>
    </div>
    <div class="sub-title">
      <p>Le {{ activity.date | date: 'dd/MM/yyyy' }} à {{ activity.date | date: 'HH:mm' }}</p>
      <p>{{ activity.location.city }}</p>
    </div>

    <p>{{ activity.description }}</p>
    <div class="activity-images">
      @for (image of activity.images; track $index) {
        <div class="image-container">
          <img [src]="apiUrl + image" [alt]="activity.title" />
        </div>
      }
    </div>
    @if (!activity.isRegistered) {
      <p-button
        (click)="toggleRegister(activity.id, activity.isRegistered)"
        id="subscribe-button"
        size="large"
        label="M'inscrire 🚀"
        aria-label="boutton d'inscription" />
    } @else {
      <p-button
        (click)="toggleRegister(activity.id, activity.isRegistered)"
        class="buttons"
        id="unsubscribe-button"
        label="Me désinscrire"
        size="large"
        aria-label="boutton de désincription" />
    }
  </section>
}
