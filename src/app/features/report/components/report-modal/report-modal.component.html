<div class="report-modal">
  <p-dialog [dismissableMask]="true" [modal]="true" [(visible)]="visible" (visibleChange)="visibleChange.emit($event)">
    <form class="report-container">
      <h2>Signaler {{ association.name }}</h2>
      <div class="report-type">
        <h3>Type</h3>
        <p-select [options]="reportTypes" optionLabel="label" optionValue="value" formControlName="selectedType" />
      </div>
      <div class="commentary-report">
        <h3>Commentaire libre</h3>
        <app-textarea-field
          [fieldConfig]="fieldConfig"
          [formGroup]="reportForm"
          [rows]="5"
          [cols]="1"
          [maxlength]="messageMaxLength"
          [submitted]="submitReport">
        </app-textarea-field>
      </div>

      <div class="actions-footer">
        <p-button label="Annuler" severity="secondary" (click)="closeModal()" />
        <p-button label="Envoyer" type="submit" (click)="sendReport()" />
      </div>
    </form>
  </p-dialog>
</div>
