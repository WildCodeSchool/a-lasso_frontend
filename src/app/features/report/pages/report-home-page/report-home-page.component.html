@if (allReports$ | async) {
  <div class="report-admin">
    <h1>Signalements</h1>
    <div class="navigation">
      <app-toggle-menu [tabs]="navigationItems$ | async" [activeTabValue]="activeNavigation" (chosenTab)="handleNavigation($event)"></app-toggle-menu>
    </div>
    <div class="report-list">
      @if ((reportsTableData$ | async)?.length > 0) {
        <app-table-data (rowClickHandler)="onRowClick($event)" [cols]="reportsTableColumns" [data]="reportsTableData$ | async"></app-table-data>
      } @else {
        <div class="empty-report">
          <i class="fa-regular fa-handshake"></i>
          <p>Aucun signalement à traiter actuellement !</p>
        </div>
      }
    </div>
  </div>

  @if (isReportDetailModalOpen) {
    <app-report-details-modal [(visible)]="isReportDetailModalOpen" [reportSelected]="reportSelected"></app-report-details-modal>
  }
}
