@if (user$ | async; as user) {
  <div class="security-container">
    <h1 class="security-title">Sécurité</h1>

    <div class="security-table">
      <div class="row">
        <span class="label">Adresse email</span>
        <span class="value">{{ user.email }}</span>
        <span class="action">
          <app-single-button [id]="3" label="Modifier" size="small" [styleClass]="ButtonStyleClass.defaultBlue" (buttonClicked)="onEmailEdit()">
          </app-single-button>
        </span>
      </div>

      <div class="row">
        <span class="label">Mot de passe</span>
        <span class="value">*****************</span>
        <span class="action">
          <app-single-button [id]="1" label="Modifier" size="small" [styleClass]="ButtonStyleClass.defaultBlue" (buttonClicked)="onPasswordEdit()">
          </app-single-button>
        </span>
      </div>

      <div class="row">
        <span class="label">Création du compte</span>
        <span class="value">{{ user.createdAt | date: 'dd/MM/yyyy' }}</span>
        <span class="action">
          <app-single-button
            [id]="2"
            label="Supprimer le compte"
            size="small"
            [styleClass]="ButtonStyleClass.defaultWhite"
            (buttonClicked)="onDeleteAccount()">
          </app-single-button>
        </span>
      </div>
    </div>
  </div>
}

<app-email-change-dialog [(visible)]="isEmailDialogVisible"></app-email-change-dialog>
<app-password-change-dialog [(visible)]="isPasswordDialogVisible"></app-password-change-dialog>
<p-confirmDialog></p-confirmDialog>
