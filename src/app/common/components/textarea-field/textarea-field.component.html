<form [formGroup]="formGroup">
  <p-iftalabel>
    <textarea pTextarea [id]="id" [placeholder]="fieldConfig.placeholder" [rows]="rows" [cols]="cols" [formControlName]="fieldConfig.name">
    </textarea>
    <label [for]="id">{{ fieldConfig.label }}</label>
  </p-iftalabel>
  <p [ngStyle]="{ color: fieldContentLength > maxlength ? 'red' : 'grey' }">{{ fieldContentLength }} / {{ maxlength }} caractères maximum</p>
</form>
