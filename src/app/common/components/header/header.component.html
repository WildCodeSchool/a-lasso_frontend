<header>
  <div class="logo">
    <img src="/LogoALAsso.png" alt="logo A l'asso!" [routerLink]="'/'" />
    <h1>a l'asso !</h1>
  </div>

  @if (isAuthenticated$ | async) {
    @if (user$ | async; as user) {
      @if (isAnAssociation(user) && !isOnActivityCreationPage()) {
        <app-single-button
          [type]="'button'"
          [id]="1"
          [routerLink]="['/activity', 'creation']"
          routerLinkActive="active"
          [label]="'Publier une activitée 🚀'"
          [ariaLabel]="'button de navigation vers la page de creation des activitées'">
        </app-single-button>
      }
    }
    <div class="user-info">
      <p class="user-name" @fadeInOut>Bonjour, {{ userDisplayName$ | async }} !</p>
      <app-header-menu></app-header-menu>
    </div>
  } @else {
    <div class="auth-buttons">
      <button class="inscription-btn" type="button" (click)="openRegisterModal()">S'inscrire</button>
      <button class="connexion-btn" type="button" (click)="openLoginModal()">Se connecter</button>
    </div>
  }
</header>

<app-register-modal [(visible)]="showRegisterModal"></app-register-modal>
<app-login-modal [(visible)]="showLoginModal"></app-login-modal>
