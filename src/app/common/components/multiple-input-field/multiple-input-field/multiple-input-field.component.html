<div class="input-wrapper">
  <div class="search-container">
    @for (field of inputConfigs; track field.label; let i = $index; let isLast = $last) {
      <div class="field-group">
        <p-inputGroup>
          @if (field.type === 'date') {
            <p-iftalabel class="custom-iftalabel calendar-wrapper" [ngClass]="{ focused: focusedIndex === i }">
              <p-calendar
                [(ngModel)]="field.value"
                (onFocus)="focusedIndex = i"
                (onBlur)="focusedIndex = null"
                [inputId]="'input-' + i"
                [placeholder]="field.placeholder"
                [showIcon]="true"
                inputStyleClass="custom-calendar-input"
                dateFormat="dd/mm/yy"
                (ngModelChange)="emitValues()" />
              @if (field.value) {
                <button class="clear-btn" type="button" (click)="clearInput(i)">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              }

              <label [for]="'input-' + i">{{ field.label }}</label>
            </p-iftalabel>
          } @else {
            <p-iftalabel class="custom-iftalabel">
              <input
                pInputText
                [id]="'input-' + i"
                [placeholder]="field.placeholder"
                [type]="field.type"
                [(ngModel)]="field.value"
                (ngModelChange)="emitValues()" />
              @if (field.value) {
                <button class="clear-btn" type="button" (click)="clearInput(i)">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              }

              <label [for]="'input-' + i">{{ field.label }}</label>
            </p-iftalabel>
          }
        </p-inputGroup>

        @if (!isLast) {
          <div class="separator"></div>
        }
      </div>
    }
  </div>

  <button pButton type="button" class="search-button">
    <i class="fa-solid fa-magnifying-glass"></i>
  </button>
</div>
