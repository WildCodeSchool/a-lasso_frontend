services:
  alasso-frontend-staging:
    image: alasso/alasso-frontend:staging
    container_name: alasso-frontend-staging
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alasso-frontend-staging.rule=Host(`staging.a-l-asso.fr`)"
      - "traefik.http.routers.alasso-frontend-staging.entrypoints=websecure"
      - "traefik.http.routers.alasso-frontend-staging.tls.certresolver=letsencrypt"
      - "traefik.http.services.alasso-frontend-staging.loadbalancer.server.port=80"

networks:
  traefik:
    external: true